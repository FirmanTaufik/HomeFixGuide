name: Android CI/CD & Firebase Distribution

on:
  push:
    branches:
      - release/**

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Debug Keystore from Secret
        if: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      # Menggunakan github.run_number agar versionCode otomatis bertambah setiap build
      - name: Build Release/Debug APK with Auto Increment Build Number
        run: ./gradlew assembleDebug -Pandroid.injected.versionCode=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  distribute:
    name: Upload to Firebase App Distribution
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/

      - name: Set up Node.js (untuk Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          # Buat kredensial sementara untuk mengatasi warning deprecated token
          echo "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" > gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp-key.json"

          # Membuat format tanggal dan jam otomatis
          BUILD_DATE=$(TZ="Asia/Jakarta" date "+%Y-%m-%d %H:%M:%S")

          # Upload ke Firebase dengan Release Notes berisi tanggal, jam, dan info branch
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "${{ secrets.FIREBASE_TESTER_GROUP }}" \
            --release-notes "🚀 Build Success!
            - Waktu Build: $BUILD_DATE WIB
            - Branch: ${{ github.ref_name }}
            - Build Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}"