name: Android CI/CD & Firebase Distribution

on:
  push:
    branches:
      - release/**  # Workflow akan otomatis ter-trigger jika kamu push ke branch dengan awalan release/ (misal: release/v1.0.0)

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (Ganti ke assembleRelease jika sudah setup Keystore/Signing)
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/app-debug.apk # Sesuaikan path jika menggunakan build release

  distribute:
    name: Upload to Firebase App Distribution
    needs: build # Job ini hanya akan jalan jika job 'build' di atas sukses
    runs-on: ubuntu-latest

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/

      - name: Set up Node.js (untuk Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "${{ secrets.FIREBASE_TESTER_GROUP }}" \
            --release-notes "Automatic build from GitHub Actions (Branch: ${{ github.ref_name }})"